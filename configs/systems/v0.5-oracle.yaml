# L05 上限实验：不检索，直接把题目标注的证据页交给模型（oracle）。
# 它回答"如果检索永远正确，阅读器能答对多少"，只能在评测时用。和 v0.5 的差距就是检索造成的损失。
# （下面是 v0.5.yaml 原来的说明）
# 在 v0.4（阅读器 + 计算器）前面接上检索：问题 → 检索 top-5 文本块 → 取它们所在的整页 → 模型回答。
#   索引：configs/index/fb_bge_small.yaml（FinanceBench 的 84 份文档，bge-small，256 token 一块）
#   上下文：page（small-to-big：用小块检索、用整页回答，表格的表头和数字不会被切开）
# 对照：v0.3（闭卷）、v0.5-chunk（只给文本块）、v0.5-oracle（直接给证据页，阅读器的上限）
name: v0.5-oracle
description: 上限实验：直接给证据页（不检索）+ 计算器

llm:
  backend: openai_compat
  base_url: https://api.deepseek.com
  model: deepseek-flash
  api_key_env: DEEPSEEK_API_KEY
  thinking: false
  max_tokens: 2048

prompt:
  name: answer_rag_v1
  max_attempts: 2

tools:
  enabled: [calculate]
  max_rounds: 6
  json_mode: false

retrieval:
  oracle: true  # 唯一的改动：不用索引，直接给证据页
  top_k: 5
  context: page
